<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de trabalho do Kauan</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            line-height: 1.5;
            color: #1f2937;
            background: #f3f4f6;
        }

        header {
            padding: 32px 16px;
            text-align: center;
            color: #ffffff;
            background: #4f46e5;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px;
        }

        section {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 12px;
            background: #ffffff;
        }

        section h2 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        footer {
            padding: 16px;
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <header>
        <h1>Área de trabalho do Kauan</h1>
        <p>Turma 1</p>
    </header>

    <main>
        <section>
            <h2>Sobre mim</h2>
            <p>Oi! Eu sou o Kauan. Aqui vou guardar meus projetos.</p>
        </section>

        <section>
            <h2>Meus projetos</h2>
            <ul>
                <li>Projeto 1 (em breve)</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Feito pelo Kauan</p>
    </footer>
</body>
</html>
