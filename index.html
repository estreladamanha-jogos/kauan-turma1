<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fagulha — Queda entre Mundos</title>
<style>
  html, body { margin: 0; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
  canvas { width: min(96vw, calc(96vh * 420 / 640)); height: auto; background: #0a0a18; border-radius: 12px; box-shadow: 0 0 30px rgba(140,90,255,.35); }
</style>
</head>
<body>
<canvas id="game" width="420" height="640"></canvas>
<script>
/* Fagulha: um ET fofo e esquisito (cabeça grande, olhos enormes, orelhas de folha, braços e pernas compridos).
   o = { vx: -1..1 (inclinação), glow: cor da luz do peito (null = apagada), hit: true, alpha, pose: 'fall' | 'stand' | 'cheer' } */
function drawFagulha(c, x, y, s, t, o) {
  o = o || {};
  const glow = o.glow === undefined ? '#ffe9a8' : o.glow;
  const pose = o.pose || 'fall';
  const hit = !!o.hit;
  const sw = Math.sin(t * 7), sw2 = Math.sin(t * 7 + 1.9);
  const blink = (t % 3.4) > 3.27 ? 0.12 : 1;
  const ear = Math.sin(t * 3.2) * 5;
  const skinL = hit ? '#f0c4c4' : '#d3cdf0', skinD = hit ? '#d99a9a' : '#9a91c4', line = '#2b2350';
  c.save(); c.translate(x, y); c.scale(s, s);
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.rotate((o.vx || 0) * 0.16);
  c.lineJoin = 'round'; c.lineCap = 'round';

  const P = { fall: [32, 78, 78, 12], stand: [-62, -78, -82, -6], cheer: [62, 88, 78, 8] }[pose];
  // ---- pernas (atrás do corpo) ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const hx = sd * 8, hy = 38;
    const kx = hx + sd * (5 + P[3] * .3) + ph * 3, ky = hy + 32;
    const fx = kx + sd * 3 + ph * (pose === 'fall' ? 9 : 2), fy = ky + 34;
    c.strokeStyle = line; c.lineWidth = 11; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.strokeStyle = skinD; c.lineWidth = 7; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2;
    c.beginPath(); c.ellipse(fx + sd * 4, fy + 3, 12, 5.5, sd * -.12, 0, 7); c.fill(); c.stroke();
  }
  // ---- corpo ----
  const gb = c.createLinearGradient(0, -6, 0, 46); gb.addColorStop(0, skinL); gb.addColorStop(1, skinD);
  c.fillStyle = gb; c.strokeStyle = line; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(-9, -8); c.bezierCurveTo(-20, 4, -20, 34, -9, 44); c.lineTo(9, 44); c.bezierCurveTo(20, 34, 20, 4, 9, -8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(0, 26, 9, 13, 0, 0, 7); c.fill();
  // luz do peito (a "fagulha")
  if (glow) {
    const r = 9 + Math.sin(t * 5) * 1.6, g = c.createRadialGradient(0, 8, 0, 0, 8, r * 2.2);
    g.addColorStop(0, '#fff'); g.addColorStop(.25, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 8, r * 2.2, 0, 7); c.fill();
  }
  // ---- braços ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const a1 = (P[0] + ph * (pose === 'fall' ? 16 : 5)) * Math.PI / 180, a2 = (P[1] + ph * (pose === 'fall' ? 18 : 6)) * Math.PI / 180;
    const sx = sd * 14, sy = 4;
    const ex = sx + sd * 30 * Math.cos(a1), ey = sy - 30 * Math.sin(a1);
    const hx = ex + sd * 32 * Math.cos(a2), hy = ey - 32 * Math.sin(a2);
    c.strokeStyle = line; c.lineWidth = 9; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.strokeStyle = skinL; c.lineWidth = 5.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    // três dedos compridos
    const dir = Math.atan2(hy - ey, hx - ex);
    for (const k of [-.55, 0, .55]) {
      const fx = hx + Math.cos(dir + k) * 13, fy = hy + Math.sin(dir + k) * 13;
      c.strokeStyle = line; c.lineWidth = 4.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
      c.strokeStyle = skinL; c.lineWidth = 2.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
    }
  }
  // ---- pescoço ----
  c.fillStyle = skinD; c.fillRect(-5, -14, 10, 10);
  // ---- orelhas ----
  for (const sd of [-1, 1]) {
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(sd * 27, -64); c.bezierCurveTo(sd * 46, -70 - ear * .5, sd * 66, -88 - ear, sd * 76, -92 - ear);
    c.bezierCurveTo(sd * 70, -66, sd * 54, -40, sd * 30, -38); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = hit ? '#e8a0a0' : '#eeaacb';
    c.beginPath(); c.moveTo(sd * 32, -60); c.bezierCurveTo(sd * 48, -66 - ear * .4, sd * 60, -80 - ear * .8, sd * 68, -84 - ear * .8);
    c.bezierCurveTo(sd * 62, -64, sd * 50, -46, sd * 34, -44); c.closePath(); c.fill();
  }
  // ---- cabeça ----
  const gh = c.createLinearGradient(0, -80, 0, -4); gh.addColorStop(0, skinL); gh.addColorStop(1, skinD);
  c.fillStyle = gh; c.strokeStyle = line; c.lineWidth = 2.6;
  c.beginPath(); c.moveTo(0, -82); c.bezierCurveTo(34, -82, 42, -50, 24, -22); c.bezierCurveTo(16, -10, 7, -5, 0, -5);
  c.bezierCurveTo(-7, -5, -16, -10, -24, -22); c.bezierCurveTo(-42, -50, -34, -82, 0, -82); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-8, -70, 12, 6, -.4, 0, 7); c.fill();
  // ---- olhos enormes ----
  const look = (o.vx || 0) * 3;
  for (const sd of [-1, 1]) {
    c.save(); c.translate(sd * 15, -44); c.rotate(sd * .22);
    if (hit) {
      c.strokeStyle = line; c.lineWidth = 3.4; c.beginPath(); c.moveTo(-8, -8); c.lineTo(8, 8); c.moveTo(8, -8); c.lineTo(-8, 8); c.stroke();
    } else {
      c.scale(1, blink);
      const ge = c.createRadialGradient(-2, -4, 1, 0, 0, 16); ge.addColorStop(0, '#3a3560'); ge.addColorStop(1, '#0a0716');
      c.fillStyle = ge; c.beginPath(); c.ellipse(0, 0, 11.5, 15, 0, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-3.5 + look, -6, 3.6, 4.6, 0, 0, 7); c.fill();
      c.beginPath(); c.arc(3.5 + look * .6, 6, 1.9, 0, 7); c.fill();
    }
    c.restore();
  }
  // ---- nariz e boca ----
  c.fillStyle = line; c.beginPath(); c.arc(-2.4, -24, 1.1, 0, 7); c.arc(2.4, -24, 1.1, 0, 7); c.fill();
  c.strokeStyle = line; c.lineWidth = 2; c.beginPath();
  if (hit) c.ellipse(0, -15, 3, 4, 0, 0, 7); else { c.moveTo(-5, -17); c.quadraticCurveTo(0, -12.5, 5, -17); }
  c.stroke();
  c.restore();
}

/* ================= JOGO: FAGULHA — QUEDA ENTRE MUNDOS ================= */
const cv = document.getElementById('game'), c = cv.getContext('2d');
if (!c.roundRect) c.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };   // navegadores antigos
const W = 420, H = 640;
const PY = 190;                 // altura fixa do Fagulha na tela (o cenário é que sobe)
const BASE_V = 230;             // velocidade da queda (pixels por segundo)
const META_M = 1000;            // metros totais até o fim do jogo
const META = META_M * 10;       // em unidades internas de "dist"
const MUNDO_M = 200;            // metros de cada mundo (5 mundos de 200m = 1000m)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- mundos ---------- */
const MUNDOS = [
  { nome: 'FLORESTA', top: '#123a1c', bottom: '#04140a', obstCor: '#4e7a4a', obstEscura: '#28401f' },
  { nome: 'GELO', top: '#173a55', bottom: '#04141f', obstCor: '#bfe6f2', obstEscura: '#5f8fa0' },
  { nome: 'VULCÃO', top: '#5c1210', bottom: '#1a0402', obstCor: '#5a3626', obstEscura: '#2a1410' },
  { nome: 'ESPAÇO ROXO', top: '#2a1152', bottom: '#0a0620', obstCor: '#8a76c9', obstEscura: '#443368' },
  { nome: 'MUSICAL', top: '#2a0a3a', bottom: '#05010a', obstCor: '#ff5fd1', obstEscura: '#7a1d63' },
];

let estado = 'inicio';          // inicio | jogando | gameover | vitoria
let t = 0, dist = 0, vel = BASE_V;
let vidas = 3, invenc = 0, cristais = 0, shake = 0;
const jog = { x: W / 2, vx: 0, dir: 1 };
let obst = [], gems = [], fx = [], amb = [], arvores = [];
let galhos = [], neves = [], fogosCeu = [], fogosLado = [], estrelasCad = [];
let tiros = [];
let notas = [];
let dashCd = 0, fireCd = 0, escudoCd = 0, escudoT = 0, gritoCd = 0;
let gritoOnda = null;
let beatT = 0.5, beatFlash = 0;
let qCiclo = 0;
let spawnT = 1, gemT = 1;
const keys = { left: false, right: false };
let worldIdx = 0, portalPassados = [false, false, false, false], portalFx = 0, portalDe = 0, portalPara = 0;
const timers = { leaf: 0, feather: 0, bird: 0, ice: 0, snowball: 0, flocos: 0, fire: 0, flame: 0, star: 0, rocket: -1, tree: 0, galho: 0, neve: 0, fogoCeu: 0, fogoLado: 0, estrelaCad: 0, nota: 0 };

function resetar() {
  estado = 'jogando'; t = 0; dist = 0; vidas = 3; invenc = 0; cristais = 0; shake = 0;
  jog.x = W / 2; jog.vx = 0; obst = []; gems = []; fx = []; amb = []; arvores = []; spawnT = 1; gemT = 1;
  galhos = []; neves = []; fogosCeu = []; fogosLado = []; estrelasCad = []; tiros = []; notas = [];
  dashCd = 0; fireCd = 0; escudoCd = 0; escudoT = 0; gritoCd = 0; gritoOnda = null; qCiclo = 0;
  beatT = 0.5; beatFlash = 0;
  worldIdx = 0; portalPassados = [false, false, false, false]; portalFx = 0;
  for (const k in timers) timers[k] = k === 'rocket' ? rnd(3, 6) : 0;
}

/* ---------- poderes: dash (ESPAÇO), fogo (E), escudo (F) e grito sônico (G) ---------- */
/* a tecla Q alterna entre os quatro a cada clique: 1º dash, 2º fogo, 3º escudo, 4º grito */
function usarDash() {
  if (dashCd > 0) return;
  const dir = jog.dir || 1;
  jog.vx = dir * 620;
  dashCd = 1.4;
  invenc = Math.max(invenc, .3);
  burst(jog.x, PY, '#bfe8ff', 12, 160);
}

function usarFogo() {
  if (fireCd > 0) return;
  fireCd = 1.6;
  tiros.push({ x: jog.x, y: PY + 20, vy: 420 });
  burst(jog.x, PY + 20, '#ffcf4d', 8, 90);
}

function usarEscudo() {
  if (escudoCd > 0) return;
  escudoCd = 4;
  escudoT = 2;
  invenc = Math.max(invenc, escudoT);
  burst(jog.x, PY, '#9ad1ff', 14, 140);
}

/* grito sônico: onda que quebra cristais de gelo e empurra o resto */
function usarGrito() {
  if (gritoCd > 0) return;
  gritoCd = 7;
  beatFlash = 1.6;
  gritoOnda = { r: 10, max: 260 };
  for (let i = 0; i < 3; i++) notas.push({ x: jog.x + rnd(-18, 18), y: PY - 30 - i * 10, vy: -70 - i * 10, life: 1 });
  burst(jog.x, PY, '#ffe9ff', 18, 200);

  const RAIO = 170;
  // quebra os cristais de gelo (obstáculos de gelo e bolas de neve)
  for (const o of obst) if (!o.morto && o.tipo === 1 && Math.hypot(o.x - jog.x, o.y - PY) < RAIO) { o.morto = true; burst(o.x, o.y, '#eaf9ff', 10, 140); }
  for (const n of neves) if (!n.morto && Math.hypot(n.x - jog.x, n.y - PY) < RAIO) { n.morto = true; burst(n.x, n.y, '#fff', 8, 120); }

  // empurra o resto
  const empurrar = it => {
    const dx = it.x - jog.x, dy = (it.y !== undefined ? it.y : PY) - PY, dd = Math.hypot(dx, dy);
    if (dd > 0 && dd < RAIO) {
      const f = (1 - dd / RAIO) * 90;
      it.x = clamp(it.x + dx / dd * f, -60, W + 60);
      if (it.y !== undefined) it.y += dy / dd * f;
    }
  };
  for (const o of obst) if (!o.morto && o.tipo !== 1) empurrar(o);
  for (const f of fogosCeu) if (!f.morto) empurrar(f);
  for (const f of fogosLado) if (!f.morto) empurrar(f);
  for (const s of estrelasCad) if (!s.morto) empurrar(s);
}

function usarQ() {
  qCiclo = (qCiclo % 4) + 1;
  if (qCiclo === 1) usarDash();
  else if (qCiclo === 2) usarFogo();
  else if (qCiclo === 3) usarEscudo();
  else usarGrito();
}

/* ---------- obstáculos principais (um tipo diferente por mundo) ---------- */
function criarObstaculo() {
  obst.push({ x: rnd(50, W - 50), y: H + 40, w: rnd(50, 88), h: rnd(40, 56), sd: Math.random(), variante: Math.floor(rnd(0, 3)), tipo: worldIdx });
}

/* batida do mundo musical: um "bip" a cada 0,5s que pulsa o fundo e, no mundo musical, cria o obstáculo */
function onBeat() {
  beatFlash = Math.max(beatFlash, .6);
  if (worldIdx === 4) criarObstaculo();
}

function desenharObstaculo(o) {
  c.save(); c.translate(o.x, o.y);
  if (o.tipo === 0) { // floresta: flor carnívora que pega o Fagulha
    const abre = .55 + Math.sin(t * 2.4 + o.sd * 8) * .35;
    c.strokeStyle = '#2f5a2a'; c.lineWidth = 8; c.beginPath(); c.moveTo(0, o.h / 2); c.lineTo(0, -o.h / 6); c.stroke();
    c.fillStyle = '#3a6b34'; c.beginPath(); c.ellipse(-o.w * .22, o.h * .1, 12, 6, .6, 0, 7); c.fill();
    c.fillStyle = '#3a6b34'; c.beginPath(); c.ellipse(o.w * .22, o.h * .28, 12, 6, -.6, 0, 7); c.fill();
    for (const sd of [-1, 1]) {
      c.save(); c.translate(0, -o.h / 6); c.rotate(sd * abre * .9);
      c.fillStyle = '#7a2d3a'; c.strokeStyle = '#3e1218'; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sd * o.w * .55, -o.h * .35, sd * o.w * .3, -o.h * .62); c.quadraticCurveTo(sd * o.w * .1, -o.h * .3, 0, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#c46a78';
      for (let i = 0; i < 4; i++) { const px = sd * o.w * (.06 + i * .07), py = -o.h * (.02 + i * .12); c.beginPath(); c.moveTo(px, py); c.lineTo(px + sd * 5, py - 9); c.lineTo(px + sd * 10, py); c.closePath(); c.fill(); }
      c.restore();
    }
    c.fillStyle = '#ffe08f'; c.beginPath(); c.arc(0, -o.h * .12, 4 + Math.sin(t * 5) * 1.5, 0, 7); c.fill();
  } else if (o.tipo === 1) { // gelo: pedras de gelo com formatos variados
    const gg = c.createLinearGradient(0, -o.h / 2, 0, o.h / 2); gg.addColorStop(0, '#eaf9ff'); gg.addColorStop(1, '#9fd3e8');
    c.fillStyle = gg; c.strokeStyle = '#5f8fa0'; c.lineWidth = 2.4;
    c.beginPath();
    if (o.variante === 0) { c.moveTo(0, -o.h / 2); c.lineTo(o.w / 3, -o.h * .1); c.lineTo(o.w / 2, o.h / 2); c.lineTo(-o.w / 2, o.h / 2); c.lineTo(-o.w / 3, -o.h * .1); c.closePath(); }
    else if (o.variante === 1) { c.moveTo(-o.w / 2, o.h / 2); c.lineTo(-o.w / 2 + 8, -o.h / 3); c.lineTo(0, -o.h / 2); c.lineTo(o.w / 2 - 6, -o.h / 4); c.lineTo(o.w / 2, o.h / 2); c.closePath(); }
    else { c.moveTo(0, -o.h / 2); c.lineTo(o.w / 2, -o.h / 6); c.lineTo(o.w / 3, o.h / 2); c.lineTo(-o.w / 3, o.h / 2); c.lineTo(-o.w / 2, -o.h / 6); c.closePath(); }
    c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(-o.w / 6, -o.h / 3); c.lineTo(o.w / 8, -o.h / 4); c.lineTo(0, 0); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(140,210,230,.7)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-o.w / 5, o.h / 5); c.lineTo(o.w / 6, -o.h / 8); c.stroke();
  } else if (o.tipo === 2) { // vulcão: fogo subindo em vez de pedra
    const fl = Math.sin(t * 9 + o.sd * 12) * 4;
    const g1 = c.createRadialGradient(0, o.h * .1, 2, 0, 0, o.w * .6);
    g1.addColorStop(0, '#fff2b0'); g1.addColorStop(.45, '#ff8a2a'); g1.addColorStop(1, 'rgba(255,60,20,0)');
    c.fillStyle = g1; c.beginPath(); c.arc(0, 0, o.w * .6, 0, 7); c.fill();
    c.fillStyle = '#ff7a1f';
    c.beginPath(); c.moveTo(-o.w * .3, o.h / 2); c.quadraticCurveTo(-o.w * .4 + fl, 0, -o.w * .12, -o.h * .55);
    c.quadraticCurveTo(0, -o.h * .2, o.w * .12, -o.h * .55); c.quadraticCurveTo(o.w * .4 - fl, 0, o.w * .3, o.h / 2); c.closePath(); c.fill();
    c.fillStyle = '#ffcf4d';
    c.beginPath(); c.moveTo(-o.w * .16, o.h / 2); c.quadraticCurveTo(-o.w * .2 + fl * .6, o.h * .1, 0, -o.h * .3);
    c.quadraticCurveTo(o.w * .2 - fl * .6, o.h * .1, o.w * .16, o.h / 2); c.closePath(); c.fill();
  } else if (o.tipo === 3) { // roxo: luas em vez de pedra
    const g = c.createRadialGradient(-o.w * .18, -o.h * .18, o.w * .05, 0, 0, o.w * .55);
    g.addColorStop(0, '#f4f1e8'); g.addColorStop(1, '#a9a494');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, o.w * .5, 0, 7); c.fill();
    c.fillStyle = 'rgba(130,125,112,.55)';
    c.beginPath(); c.arc(-o.w * .14, -o.h * .1, o.w * .1, 0, 7); c.fill();
    c.beginPath(); c.arc(o.w * .12, o.h * .08, o.w * .07, 0, 7); c.fill();
    c.beginPath(); c.arc(o.w * .02, -o.h * .22, o.w * .06, 0, 7); c.fill();
  } else { // musical: nota gigante pulsando no ritmo da batida
    const pulso = 1 + Math.sin(t * 6) * .15;
    c.save(); c.scale(pulso, pulso);
    c.strokeStyle = '#7a1d63'; c.lineWidth = 3;
    c.fillStyle = '#ff5fd1'; c.beginPath(); c.ellipse(-o.w * .12, o.h * .28, o.w * .22, o.h * .16, -.3, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#ff5fd1'; c.fillRect(o.w * .06, -o.h * .5, 6, o.h * .8);
    c.beginPath(); c.moveTo(o.w * .06, -o.h * .5); c.quadraticCurveTo(o.w * .35, -o.h * .4, o.w * .3, -o.h * .1);
    c.quadraticCurveTo(o.w * .15, -o.h * .2, o.w * .06, -o.h * .05); c.closePath(); c.fillStyle = '#ffd6f5'; c.fill();
    c.restore();
  }
  c.restore();
}

/* ---------- partículas de efeito (colisão/coleta) ---------- */
function burst(x, y, cor, n, v) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(30, v || 140); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.3, .7), max: .7, cor, r: rnd(1.5, 3.6) }); }
}

/* ---------- partículas ambiente (decorativas, por mundo) ---------- */
function spawnAmbiente(dt) {
  for (const k in timers) timers[k] -= dt;

  if (worldIdx === 0) { // floresta
    if (timers.leaf <= 0) {
      const cores = ['#7fbf5a', '#c9e07a', '#e0c25a', '#b5652f', '#5aa06e'];
      amb.push({ tp: 'folha', x: rnd(10, W - 10), y: -20, vy: rnd(40, 80), vx: rnd(-20, 20), rot: rnd(0, 6.28), vr: rnd(-2, 2), cor: cores[Math.floor(rnd(0, cores.length))], sz: rnd(6, 10) });
      timers.leaf = rnd(.25, .5);
    }
    if (timers.feather <= 0) {
      const cores = ['#ff8fb0', '#8fd6ff', '#ffe08f', '#c7a8ff', '#ffffff'];

      timers.feather = rnd(.35, .7);

    if (timers.bird <= 0) {
      const cores = ['#ff4d4d', '#3dd6ff', '#ffd93d', '#7dff8f']; // arara, periquito, canário, papagaio
      amb.push({ tp: 'passaro', x: -20, y: rnd(60, 260), vy: 0, vx: rnd(70, 120), fase: rnd(0, 6.28), cor: cores[Math.floor(rnd(0, cores.length))], cor2: cores[Math.floor(rnd(0, cores.length))] });
      timers.bird = rnd(3, 6);
    }
    if (timers.tree <= 0) {
      arvores.push({ y: H + 60, lado: Math.random() < .5 ? -1 : 1, tipo: 'arvore' });
      timers.tree = rnd(6, 9);
    }
  } else if (worldIdx === 1) { // gelo
    if (timers.ice <= 0) {
      amb.push({ tp: 'gelo', x: rnd(10, W - 10), y: -20, vy: rnd(90, 150), vx: rnd(-10, 10), rot: rnd(0, 6.28), vr: rnd(-4, 4), sz: rnd(6, 12) });

    }
    if (timers.snowball <= 0) {

    }
    if (timers.flocos <= 0) {
      amb.push({ tp: 'floco', x: rnd(10, W - 10), y: -20, vy: rnd(30, 55), vx: rnd(-30, 30), rot: rnd(0, 6.28), vr: rnd(-1.5, 1.5), sz: rnd(4, 8) });
      timers.flocos = rnd(.12, .28);
    }
    if (timers.tree <= 0) {
      arvores.push({ y: H + 60, lado: Math.random() < .5 ? -1 : 1, tipo: 'gelopedra' });
      timers.tree = rnd(7, 10);
    }
  } else if (worldIdx === 2) { // vulcão
    if (timers.fire <= 0) {
      amb.push({ tp: 'faisca', x: rnd(10, W - 10), y: -10, vy: rnd(90, 160), vx: rnd(-20, 20), sz: rnd(1.5, 3.2) });
      timers.fire = rnd(.05, .15);
    }
    if (timers.flame <= 0) {
      amb.push({ tp: 'foguinho', x: rnd(10, W - 10), y: -15, vy: rnd(60, 110), vx: rnd(-15, 15), fase: rnd(0, 6.28), sz: rnd(6, 11) });
      timers.flame = rnd(.25, .5);
    }

  } else if (worldIdx === 3) { // roxo
    if (timers.star <= 0) {
      amb.push({ tp: 'estrela', x: rnd(10, W - 10), y: -10, vy: rnd(50, 100), vx: rnd(-10, 10), fase: rnd(0, 6.28), sz: rnd(2, 4) });
      timers.star = rnd(.08, .2);
    }
    if (timers.rocket <= 0) {
      amb.push({ tp: 'foguete', x: -30, y: rnd(80, 300), vy: -40, vx: rnd(90, 130) });
      timers.rocket = rnd(5, 9);
    }
    if (timers.tree <= 0) {
      arvores.push({ y: H + 60, lado: Math.random() < .5 ? -1 : 1, tipo: 'lua' });
      timers.tree = rnd(8, 11);
    }
  } else if (worldIdx === 4) { // musical
    if (timers.nota <= 0) {
      const cores = ['#ff5fd1', '#7afcff', '#ffe94d', '#a5ff7a'];
      amb.push({ tp: 'notaamb', x: rnd(10, W - 10), y: -20, vy: rnd(30, 60), vx: rnd(-15, 15), rot: rnd(0, 6.28), vr: rnd(-1, 1), cor: cores[Math.floor(rnd(0, cores.length))], sz: rnd(10, 16) });
      timers.nota = rnd(.3, .6);
    }
    if (timers.tree <= 0) {
      arvores.push({ y: H + 60, lado: Math.random() < .5 ? -1 : 1, tipo: 'caixasom' });
      timers.tree = rnd(7, 10);
    }
  }

  for (const p of amb) { p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; if (p.rot !== undefined) p.rot += (p.vr || 0) * dt; }
  amb = amb.filter(p => p.y < H + 40 && p.y > -60 && p.x > -60 && p.x < W + 60);
}

function desenharAmbiente() {
  for (const p of amb) {
    c.save(); c.translate(p.x, p.y);
    if (p.tp === 'folha') {
      c.rotate(p.rot); c.fillStyle = p.cor; c.beginPath(); c.ellipse(0, 0, p.sz, p.sz * .55, 0, 0, 7); c.fill();
    } else if (p.tp === 'pena') {
      c.rotate(p.rot); c.fillStyle = p.cor; c.beginPath();
      c.moveTo(0, -p.sz); c.quadraticCurveTo(p.sz * .6, 0, 0, p.sz); c.quadraticCurveTo(-p.sz * .6, 0, 0, -p.sz); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = .8; c.beginPath(); c.moveTo(0, -p.sz); c.lineTo(0, p.sz); c.stroke();
    } else if (p.tp === 'passaro') {
      const fl = Math.sin(t * 12 + p.fase) * 8;
      c.fillStyle = p.cor; c.beginPath(); c.ellipse(0, 0, 10, 5, 0, 0, 7); c.fill();
      c.fillStyle = p.cor2; c.beginPath(); c.moveTo(-8, 0); c.lineTo(-16, fl); c.lineTo(-8, 3); c.fill();
      c.beginPath(); c.moveTo(8, 0); c.lineTo(16, -fl); c.lineTo(8, 3); c.fill();
      c.fillStyle = '#ffcf4d'; c.beginPath(); c.moveTo(10, -1); c.lineTo(15, 0); c.lineTo(10, 1); c.fill();
    } else if (p.tp === 'gelo') {
      c.rotate(p.rot); c.fillStyle = '#cfeffb'; c.strokeStyle = '#8fc9de'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, -p.sz); c.lineTo(p.sz * .7, p.sz * .5); c.lineTo(-p.sz * .7, p.sz * .5); c.closePath(); c.fill(); c.stroke();
    } else if (p.tp === 'bolaneve') {
      c.fillStyle = '#fff'; c.strokeStyle = '#cfe8f2'; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, p.sz, 0, 7); c.fill(); c.stroke();
    } else if (p.tp === 'floco') {
      c.rotate(p.rot); c.strokeStyle = '#fff'; c.lineWidth = 1.4;
      for (let i = 0; i < 3; i++) { c.save(); c.rotate(i * 1.047); c.beginPath(); c.moveTo(0, -p.sz); c.lineTo(0, p.sz); c.stroke(); c.restore(); }
    } else if (p.tp === 'faisca') {
      c.fillStyle = `rgba(255,${Math.floor(rnd(140, 220))},60,.9)`; c.beginPath(); c.arc(0, 0, p.sz, 0, 7); c.fill();
    } else if (p.tp === 'foguinho') {
      const fl = Math.sin(t * 10 + p.fase) * 2;
      c.fillStyle = '#ff7a1f'; c.beginPath(); c.moveTo(0, -p.sz); c.quadraticCurveTo(p.sz + fl, 0, 0, p.sz); c.quadraticCurveTo(-p.sz + fl, 0, 0, -p.sz); c.fill();
      c.fillStyle = '#ffd93d'; c.beginPath(); c.ellipse(0, p.sz * .2, p.sz * .35, p.sz * .5, 0, 0, 7); c.fill();
    } else if (p.tp === 'estrela') {
      const tw = .5 + Math.abs(Math.sin(t * 5 + p.fase)) * .5;
      c.globalAlpha = tw; c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, p.sz, 0, 7); c.fill(); c.globalAlpha = 1;
    } else if (p.tp === 'foguete') {
      c.rotate(-.6);
      c.fillStyle = '#e8e8f0'; c.beginPath(); c.ellipse(0, 0, 8, 16, 0, 0, 7); c.fill();
      c.fillStyle = '#ff5555'; c.beginPath(); c.moveTo(0, -16); c.lineTo(6, -6); c.lineTo(-6, -6); c.closePath(); c.fill();
      c.fillStyle = '#ff9a3d'; c.beginPath(); c.moveTo(-4, 14); c.lineTo(4, 14); c.lineTo(0, 30 + Math.sin(t * 20) * 6); c.closePath(); c.fill();
    } else if (p.tp === 'notaamb') {
      c.rotate(p.rot); c.fillStyle = p.cor;
      c.beginPath(); c.ellipse(-p.sz * .35, p.sz * .55, p.sz * .35, p.sz * .22, -.3, 0, 7); c.fill();
      c.fillRect(p.sz * .06, -p.sz * .8, p.sz * .12, p.sz * 1.3);
    }
    c.restore();
  }
}

/* marcos gigantes de cada mundo: árvore, pedra de gelo, rocha do vulcão, lua (parallax, decorativos) */
function desenharArvores(dt) {
  for (const a of arvores) a.y -= vel * dt;
  arvores = arvores.filter(a => a.y > -260);
  for (const a of arvores) {
    const x = a.lado === -1 ? -10 : W + 10;
    c.save(); c.translate(x, a.y);
    if (a.tipo === 'gelopedra') {
      // pedra/bloco de gelo gigante no canto
      c.fillStyle = '#dff6fb'; c.strokeStyle = '#8fc9de'; c.lineWidth = 2.4;
      c.beginPath();
      c.moveTo(-20 * a.lado, 70); c.lineTo(-42 * a.lado, 10); c.lineTo(-16 * a.lado, -68); c.lineTo(20 * a.lado, -92);
      c.lineTo(46 * a.lado, -28); c.lineTo(30 * a.lado, 60); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.55)';
      c.beginPath(); c.moveTo(-14 * a.lado, -58); c.lineTo(12 * a.lado, -74); c.lineTo(6 * a.lado, -18); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(140,210,230,.7)'; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(-10 * a.lado, 40); c.lineTo(16 * a.lado, -10); c.stroke();
    } else if (a.tipo === 'vulcaoparte') {
      // pedaço de rocha vulcânica com rachaduras de lava
      c.fillStyle = '#2e1712'; c.strokeStyle = '#160a07'; c.lineWidth = 2.4;
      c.beginPath();
      c.moveTo(-18 * a.lado, 70); c.lineTo(-40 * a.lado, -8); c.lineTo(-10 * a.lado, -90); c.lineTo(24 * a.lado, -70);
      c.lineTo(42 * a.lado, -8); c.lineTo(26 * a.lado, 60); c.closePath(); c.fill(); c.stroke();
      const glowT = .5 + Math.sin(t * 3) * .5;
      c.strokeStyle = `rgba(255,${140 + glowT * 60},40,${.7 + glowT * .3})`; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-10 * a.lado, 20); c.lineTo(6 * a.lado, -30); c.lineTo(-6 * a.lado, -58); c.stroke();
      c.fillStyle = 'rgba(120,120,120,.28)';
      c.beginPath(); c.ellipse(6 * a.lado, -100, 22, 14, 0, 0, 7); c.fill();
    } else if (a.tipo === 'lua') {
      // parte da lua visível na lateral
      const g = c.createRadialGradient(-24 * a.lado, -22, 12, 0, 0, 90);
      g.addColorStop(0, '#f4f1e8'); g.addColorStop(1, '#b8b3a0');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, 76, 0, 7); c.fill();
      c.fillStyle = 'rgba(150,145,130,.5)';
      c.beginPath(); c.arc(-22 * a.lado, -18, 12, 0, 7); c.fill();
      c.beginPath(); c.arc(9 * a.lado, 24, 9, 0, 7); c.fill();
      c.beginPath(); c.arc(28 * a.lado, -32, 7, 0, 7); c.fill();
    } else if (a.tipo === 'caixasom') {
      // caixa de som gigante pulsando no ritmo
      const pulso = 1 + beatFlash * .12;
      c.save(); c.scale(pulso, pulso);
      c.fillStyle = '#1a1220'; c.strokeStyle = '#ff5fd1'; c.lineWidth = 3;
      c.beginPath(); c.roundRect ? c.roundRect(-30 * a.lado, -110, 60 * a.lado, 130, 8) : c.rect(-30 * a.lado, -110, 60 * a.lado, 130);
      c.fill(); c.stroke();
      c.fillStyle = '#333'; c.beginPath(); c.arc(0, -70, 20, 0, 7); c.fill();
      c.strokeStyle = '#ff5fd1'; c.beginPath(); c.arc(0, -70, 20, 0, 7); c.stroke();
      c.fillStyle = '#333'; c.beginPath(); c.arc(0, -20, 14, 0, 7); c.fill();
      c.strokeStyle = '#7afcff'; c.beginPath(); c.arc(0, -20, 14, 0, 7); c.stroke();
      c.restore();
    } else {
      // árvore gigante da floresta
      c.fillStyle = '#4a3320'; c.beginPath(); c.moveTo(-14 * a.lado, 60); c.lineTo(14 * a.lado, 60); c.lineTo(9 * a.lado, -60); c.lineTo(-9 * a.lado, -60); c.closePath(); c.fill();
      const g = c.createRadialGradient(0, -110, 10, 0, -110, 120);
      g.addColorStop(0, '#dff2b0'); g.addColorStop(1, '#a8d97a');
      c.fillStyle = g; c.beginPath(); c.arc(0, -110, 110, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.arc(-30 * a.lado, -150, 40, 0, 7); c.fill();
    }
    c.restore();
  }
}

/* ---------- perigos especiais de cada mundo ---------- */
function spawnPerigos(dt) {
  if (worldIdx === 0) { // floresta: galho com passaro que bica
    if (timers.galho <= 0) {
      galhos.push({ y: H + 60, lado: Math.random() < .5 ? -1 : 1, peckT: rnd(1.4, 2.2), peckOn: 0 });
      timers.galho = rnd(5.5, 8);
    }
  } else if (worldIdx === 1) { // gelo: bolas grandes de neve caindo do céu
    if (timers.neve <= 0) {
      neves.push({ x: rnd(40, W - 40), y: -30, vy: rnd(140, 200), r: rnd(20, 28) });
      timers.neve = rnd(1.3, 2.1);
    }
  } else if (worldIdx === 2) { // vulcão: fogos caindo do céu + fogos saindo pelos lados
    if (timers.fogoCeu <= 0) {
      fogosCeu.push({ x: rnd(30, W - 30), y: -20, vy: rnd(150, 210), r: rnd(9, 13) });
      timers.fogoCeu = rnd(.5, .9);
    }
    if (timers.fogoLado <= 0) {
      const lado = Math.random() < .5 ? -1 : 1;
      fogosLado.push({ x: lado === -1 ? -20 : W + 20, y: rnd(80, 320), vx: lado * rnd(160, 220), r: 9 });
      timers.fogoLado = rnd(1.1, 1.8);
    }
  } else if (worldIdx === 3) { // roxo: estrelas cadentes que tiram vida
    if (timers.estrelaCad <= 0) {
      estrelasCad.push({ x: rnd(30, W - 30), y: -20, vy: rnd(180, 240), vx: rnd(-30, 30), r: rnd(8, 11) });
      timers.estrelaCad = rnd(.6, 1);
    }
  }

  for (const g of galhos) {
    g.y -= vel * dt; g.peckT -= dt;
    if (g.peckT <= 0) { g.peckOn = .18; g.peckT = rnd(1.8, 2.6); }
    if (g.peckOn > 0) g.peckOn -= dt;
  }
  galhos = galhos.filter(g => g.y > -80);

  for (const n of neves) n.y += n.vy * dt;
  neves = neves.filter(n => n.y < H + 40 && !n.morto);

  for (const f of fogosCeu) f.y += f.vy * dt;
  fogosCeu = fogosCeu.filter(f => f.y < H + 40 && !f.morto);

  for (const f of fogosLado) f.x += f.vx * dt;
  fogosLado = fogosLado.filter(f => f.x > -40 && f.x < W + 40 && !f.morto);

  for (const s of estrelasCad) { s.y += s.vy * dt; s.x += s.vx * dt; }
  estrelasCad = estrelasCad.filter(s => s.y < H + 40 && !s.morto);
}

function checarColisaoPerigos() {
  const hit = (px, py, r) => invenc <= 0 && Math.abs(px - jog.x) < r + 16 && Math.abs(py - PY) < r + 26;

  for (const g of galhos) {
    if (g.peckOn > 0 && invenc <= 0) {
      const tipX = g.lado === -1 ? W / 2 + 44 : W / 2 - 44;
      if (Math.abs(jog.x - tipX) < 30 && Math.abs(PY - g.y) < 40) { levarDano(); return; }
    }
  }
  for (const n of neves) if (!n.morto && hit(n.x, n.y, n.r)) { levarDano(n); return; }
  for (const f of fogosCeu) if (!f.morto && hit(f.x, f.y, f.r)) { levarDano(f); return; }
  for (const f of fogosLado) if (!f.morto && hit(f.x, f.y, f.r)) { levarDano(f); return; }
  for (const s of estrelasCad) if (!s.morto && hit(s.x, s.y, s.r)) { levarDano(s); return; }
}

function desenharGalhos() {
  for (const g of galhos) {
    const bx0 = g.lado === -1 ? 0 : W / 2 - 20;
    const bx1 = g.lado === -1 ? W / 2 + 20 : W;
    c.save(); c.translate(0, g.y);
    c.fillStyle = '#4a3320'; c.strokeStyle = '#2c1f13'; c.lineWidth = 2;
    c.fillRect(bx0, -9, bx1 - bx0, 18); c.strokeRect(bx0, -9, bx1 - bx0, 18);
    c.fillStyle = '#5aa06e';
    for (let i = 0; i < 4; i++) { const fx = bx0 + (bx1 - bx0) * (i + .5) / 4; c.beginPath(); c.ellipse(fx, -15, 10, 6, 0, 0, 7); c.fill(); }
    const openDir = g.lado === -1 ? 1 : -1;
    const tipX = g.lado === -1 ? bx1 : bx0;
    const peckOffset = g.peckOn > 0 ? openDir * 24 : 0;
    c.save(); c.translate(tipX + peckOffset, -16); c.scale(openDir, 1);
    c.fillStyle = '#e0553d'; c.beginPath(); c.ellipse(0, 0, 12, 9, 0, 0, 7); c.fill();
    c.fillStyle = '#f4c542'; c.beginPath(); c.moveTo(10, -1); c.lineTo(21, 0); c.lineTo(10, 3); c.closePath(); c.fill();
    c.fillStyle = '#222'; c.beginPath(); c.arc(4, -3, 1.6, 0, 7); c.fill();
    c.restore();
    c.restore();
  }
}

function desenharNeves() {
  for (const n of neves) {
    c.save(); c.translate(n.x, n.y);
    c.fillStyle = '#fff'; c.strokeStyle = '#cfe3ec'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, n.r, 0, 7); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(-n.r * .3, -n.r * .3, n.r * .4, 0, 7); c.fill();
    c.restore();
  }
}

function desenharFogosCeu() {
  for (const f of fogosCeu) {
    c.save(); c.translate(f.x, f.y);
    const g = c.createRadialGradient(0, 0, 1, 0, 0, f.r * 1.8);
    g.addColorStop(0, '#fff2b0'); g.addColorStop(.5, '#ff8a2a'); g.addColorStop(1, 'rgba(255,60,20,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, f.r * 1.8, 0, 7); c.fill();
    c.fillStyle = '#ffcf4d'; c.beginPath(); c.arc(0, 0, f.r, 0, 7); c.fill();
    c.restore();
  }
}

function desenharFogosLado() {
  for (const f of fogosLado) {
    c.save(); c.translate(f.x, f.y);
    const dir = f.vx > 0 ? 1 : -1; c.scale(dir, 1);
    const g = c.createRadialGradient(0, 0, 1, 0, 0, f.r * 2);
    g.addColorStop(0, '#fff2b0'); g.addColorStop(.5, '#ff6a2a'); g.addColorStop(1, 'rgba(255,60,20,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, f.r * 2, 0, 7); c.fill();
    c.fillStyle = '#ff9a3d'; c.beginPath(); c.moveTo(-f.r * 2, -4); c.lineTo(-f.r * 4, 0); c.lineTo(-f.r * 2, 4); c.closePath(); c.fill();
    c.fillStyle = '#ffe08f'; c.beginPath(); c.arc(f.r * .3, 0, f.r * .8, 0, 7); c.fill();
    c.restore();
  }
}

function desenharEstrelasCad() {
  for (const s of estrelasCad) {
    c.save(); c.translate(s.x, s.y); c.rotate(Math.atan2(s.vy, s.vx));
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-s.r * 4, 0); c.lineTo(0, 0); c.stroke();
    c.fillStyle = '#fff'; c.beginPath();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2; const rr = i % 2 === 0 ? s.r : s.r * .45; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; if (i === 0) c.moveTo(px, py); else c.lineTo(px, py); }
    c.closePath(); c.fill();
    c.restore();
  }
}

function desenharTiros() {
  for (const p of tiros) {
    c.save(); c.translate(p.x, p.y);
    const g = c.createRadialGradient(0, -8, 1, 0, 0, 16);
    g.addColorStop(0, '#fff2b0'); g.addColorStop(.5, '#ff8a2a'); g.addColorStop(1, 'rgba(255,60,20,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 16, 0, 7); c.fill();
    c.fillStyle = '#ffcf4d'; c.beginPath(); c.arc(0, -2, 7, 0, 7); c.fill();
    c.restore();
  }
}

/* ---------- entrada ---------- */
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(k)) e.preventDefault();
  if (estado !== 'jogando') { if (k === 'Space' || k === 'Enter' || k === 'KeyR') resetar(); return; }
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (e.repeat) return;
  if (k === 'Space') usarDash();
  if (k === 'KeyE') usarFogo();
  if (k === 'KeyF') usarEscudo();
  if (k === 'KeyG') usarGrito();
  if (k === 'KeyQ') usarQ();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

/* ---------- atualização ---------- */
function update(dt) {
  if (estado !== 'jogando') return;
  t += dt;
  vel = BASE_V;
  dist += vel * dt;
  if (invenc > 0) invenc -= dt;
  if (shake > 0) shake -= dt;
  if (portalFx > 0) portalFx -= dt;

  const metros = dist / 10;

  // ---- mundos: troca e portal a cada 200 m (5 mundos) ----
  const novoIdx = Math.min(4, Math.floor(metros / MUNDO_M));
  for (let i = 0; i < 4; i++) {
    const limite = (i + 1) * MUNDO_M;
    if (!portalPassados[i] && metros >= limite) {
      portalPassados[i] = true; portalFx = 1.3; portalDe = worldIdx; portalPara = Math.min(4, i + 1);
      // limpa tudo do mundo anterior, nada atravessa o portal
      amb = []; arvores = []; galhos = []; neves = []; fogosCeu = []; fogosLado = []; estrelasCad = []; obst = []; tiros = []; notas = [];
    }
  }
  worldIdx = novoIdx;

  // ---- poderes ----
  if (dashCd > 0) dashCd -= dt;
  if (fireCd > 0) fireCd -= dt;
  if (escudoCd > 0) escudoCd -= dt;
  if (escudoT > 0) escudoT -= dt;
  if (gritoCd > 0) gritoCd -= dt;
  if (gritoOnda) { gritoOnda.r += 480 * dt; if (gritoOnda.r > gritoOnda.max) gritoOnda = null; }
  for (const n of notas) { n.y += n.vy * dt; n.life -= dt; }
  notas = notas.filter(n => n.life > 0);

  // ---- batida do mundo musical (um "bip" a cada 0,5s, pulsa o fundo) ----
  beatT -= dt;
  if (beatT <= 0) { beatT = 0.5; onBeat(); }
  if (beatFlash > 0) beatFlash -= dt * 1.5;

  // ---- movimento do Fagulha ----
  const ax = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (ax) jog.dir = ax;
  jog.vx += (ax * 300 - jog.vx) * Math.min(1, dt * 10);
  jog.x = clamp(jog.x + jog.vx * dt, 34, W - 34);

  // ---- tiro de fogo (poder do Q) ----
  for (const p of tiros) p.y += p.vy * dt;
  for (const p of tiros) {
    for (const o of obst) if (!o.morto && Math.abs(o.x - p.x) < 40 && Math.abs(o.y - p.y) < 40) { o.morto = true; p.morto = true; burst(o.x, o.y, '#ff7a1f', 10, 120); }
    for (const n of neves) if (!n.morto && Math.abs(n.x - p.x) < n.r + 20 && Math.abs(n.y - p.y) < n.r + 20) { n.morto = true; p.morto = true; burst(n.x, n.y, '#ff7a1f', 8, 100); }
    for (const f of fogosCeu) if (!f.morto && Math.abs(f.x - p.x) < f.r + 20 && Math.abs(f.y - p.y) < f.r + 20) { f.morto = true; p.morto = true; burst(f.x, f.y, '#ff7a1f', 8, 100); }
    for (const s of estrelasCad) if (!s.morto && Math.abs(s.x - p.x) < s.r + 20 && Math.abs(s.y - p.y) < s.r + 20) { s.morto = true; p.morto = true; burst(s.x, s.y, '#ff7a1f', 8, 100); }
  }
  tiros = tiros.filter(p => p.y < H + 40 && !p.morto);

  // ---- ambiente decorativo ----
  spawnAmbiente(dt);
  desenharArvores(dt);

  // ---- perigos especiais de cada mundo ----
  spawnPerigos(dt);
  checarColisaoPerigos();

  // ---- obstáculos (no mundo musical eles só nascem no bip da batida) ----
  spawnT -= dt;
  if (spawnT <= 0 && worldIdx !== 4) { criarObstaculo(); spawnT = 1.0; }
  for (const o of obst) o.y -= vel * dt;
  obst = obst.filter(o => o.y > -80 && !o.morto);

  // ---- cristais ----
  gemT -= dt;
  if (gemT <= 0) { gems.push({ x: rnd(40, W - 40), y: H + 30 }); gemT = .75; }
  for (const g of gems) g.y -= vel * dt;
  gems = gems.filter(g => {
    if (Math.abs(g.x - jog.x) < 28 && Math.abs(g.y - (PY + 4)) < 44) { cristais++; burst(g.x, g.y, '#7af6ff', 8, 90); return false; }
    return g.y > -30;
  });

  // ---- colisões ----
  const hb = { x: jog.x - 15, y: PY - 26, w: 30, h: 58 };
  for (const o of obst) {
    if (o.morto) continue;
    const ox = o.x - o.w * .42, oy = o.y - o.h * .42, ow = o.w * .84, oh = o.h * .84;
    if (hb.x < ox + ow && hb.x + hb.w > ox && hb.y < oy + oh && hb.y + hb.h > oy) {
      if (invenc > 0) continue;
      levarDano(o);
      break;
    }
  }

  // ---- partículas de efeito ----
  for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);

  // ---- fim de jogo ----
  if (dist >= META) { estado = 'vitoria'; }
}

function levarDano(o) {
  vidas--; invenc = 1.5; shake = .3; burst(jog.x, PY, '#ff5577', 16, 180);
  if (o) o.morto = true;
  if (vidas <= 0) estado = 'gameover';
}

/* ---------- desenho ---------- */
function fundo() {
  const m = MUNDOS[worldIdx];
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, m.top); g.addColorStop(1, m.bottom); c.fillStyle = g; c.fillRect(0, 0, W, H);

  if (worldIdx === 2) { // vulcão: parte do vulcão ao fundo + brilho vermelho pulsante
    c.fillStyle = `rgba(255,60,20,${.08 + Math.abs(Math.sin(t * 2)) * .06})`; c.fillRect(0, 0, W, H);
    c.fillStyle = '#3a1710'; c.beginPath(); c.moveTo(-20, H); c.lineTo(W * .55, H * .78); c.lineTo(W * .85, H); c.closePath(); c.fill();
    const gc = c.createRadialGradient(W * .55, H * .8, 4, W * .55, H * .8, 60);
    gc.addColorStop(0, '#ffd23d'); gc.addColorStop(1, 'rgba(255,80,20,0)');
    c.fillStyle = gc; c.beginPath(); c.arc(W * .55, H * .8, 60, 0, 7); c.fill();
  } else if (worldIdx === 4) { // musical: fundo pulsa no ritmo da batida
    c.fillStyle = `rgba(255,95,209,${beatFlash * .35})`; c.fillRect(0, 0, W, H);
  }

  c.fillStyle = worldIdx === 0 ? '#0e2a15' : worldIdx === 1 ? '#0e2438' : worldIdx === 2 ? '#2a0f0a' : worldIdx === 3 ? '#1a0e38' : '#1a0522';
  for (let k = -1; k < 8; k++) { const y = k * 100 - (dist % 100); c.fillRect(0, y, 26, 100); c.fillRect(W - 26, y, 26, 100); }
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 2; for (let k = -1; k < 8; k++) { const y = k * 100 - (dist % 100); c.strokeRect(2, y + 2, 22, 96); c.strokeRect(W - 24, y + 2, 22, 96); }
}

function desenharPortal() {
  if (portalFx <= 0) return;
  const prog = 1 - clamp(portalFx / 1.3, 0, 1);
  const raio = 20 + prog * 480;
  const alpha = portalFx > .3 ? 1 : portalFx / .3;
  c.save(); c.globalAlpha = alpha * .55;
  const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, raio);
  g.addColorStop(0, MUNDOS[portalPara].top); g.addColorStop(.55, MUNDOS[portalPara].obstCor); g.addColorStop(.85, MUNDOS[portalDe].obstCor); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(W / 2, H / 2, raio, 0, 7); c.fill();
  c.globalAlpha = alpha;
  c.strokeStyle = MUNDOS[portalPara].obstCor; c.lineWidth = 6; c.beginPath(); c.arc(W / 2, H / 2, Math.min(raio, 130), 0, 7); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 2.4; c.beginPath(); c.arc(W / 2, H / 2, Math.min(raio, 130) - 6, 0, 7); c.stroke();
  c.strokeStyle = MUNDOS[portalDe].obstCor; c.lineWidth = 3; c.beginPath(); c.arc(W / 2, H / 2, Math.min(raio, 130) + 8, 0, 7); c.stroke();
  c.restore();
  if (portalFx > .5) texto('PORTAL: ' + MUNDOS[portalPara].nome, W / 2, H / 2, 13, '#fff');
}

function desenhar() {
  c.save();
  if (shake > 0) c.translate(rnd(-5, 5), rnd(-5, 5));
  fundo();
  if (beatFlash > 0) { c.save(); c.globalAlpha = clamp(beatFlash, 0, 1) * .3; c.fillStyle = MUNDOS[worldIdx].obstCor; c.fillRect(0, 0, W, H); c.globalAlpha = 1; c.restore(); }
  desenharArvores(0);
  desenharAmbiente();

  for (const g of gems) {
    c.save(); c.translate(g.x, g.y); c.rotate(Math.sin(t * 3 + g.x) * .3);
    c.fillStyle = '#7af6ff'; c.beginPath(); c.moveTo(0, -11); c.lineTo(8, 0); c.lineTo(0, 11); c.lineTo(-8, 0); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-1, -8); c.lineTo(3, -1); c.lineTo(-3, -1); c.fill(); c.restore();
  }
  for (const o of obst) desenharObstaculo(o);
  desenharGalhos();
  desenharNeves();
  desenharFogosCeu();
  desenharFogosLado();
  desenharEstrelasCad();
  desenharTiros();

  // ---- o Fagulha ----
  const piscando = invenc > 0 && escudoT <= 0 && Math.floor(t * 14) % 2 === 0;
  if (estado !== 'gameover') {
    drawFagulha(c, jog.x, PY + 12, .42, t, {
      vx: clamp(jog.vx / 300, -1, 1), hit: invenc > 1.2 && escudoT <= 0,
      alpha: piscando ? .3 : 1 });
    if (escudoT > 0) {
      c.save(); c.translate(jog.x, PY + 12);
      const pulso = 40 + Math.sin(t * 8) * 3;
      c.globalAlpha = clamp(escudoT / 2, .3, 1) * .5;
      c.fillStyle = '#9ad1ff'; c.beginPath(); c.arc(0, 0, pulso, 0, 7); c.fill();
      c.globalAlpha = clamp(escudoT / 2, .3, 1);
      c.strokeStyle = '#dff1ff'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, pulso, 0, 7); c.stroke();
      c.globalAlpha = 1;
      c.restore();
    }
  }
  for (const p of fx) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.cor; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  if (gritoOnda) {
    c.save(); c.globalAlpha = clamp(1 - gritoOnda.r / gritoOnda.max, 0, 1) * .7;
    c.strokeStyle = '#ffe9ff'; c.lineWidth = 6; c.beginPath(); c.arc(jog.x, PY, gritoOnda.r, 0, 7); c.stroke();
    c.globalAlpha = 1; c.restore();
  }
  for (const n of notas) { c.save(); c.globalAlpha = clamp(n.life, 0, 1); c.font = '20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffe9ff'; c.fillText('♪', n.x, n.y); c.globalAlpha = 1; c.restore(); }
  desenharPortal();
  c.restore();
  hud();
  telas();
}

/* ---------- HUD e telas ---------- */
function texto(txt, x, y, tam, cor, al) {
  c.font = `${tam}px 'Press Start 2P', monospace`; c.textAlign = al || 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, tam / 4); c.strokeStyle = '#0a0a18'; c.strokeText(txt, x, y); c.fillStyle = cor; c.fillText(txt, x, y);
}
function hud() {
  if (estado === 'inicio') return;
  c.font = '20px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) c.fillText(i < vidas ? '❤️' : '🖤', 12 + i * 26, 22);
  texto('💎 ' + cristais, W - 14, 22, 12, '#7af6ff', 'right');
  texto(MUNDOS[worldIdx].nome, W / 2, 22, 9, '#ffe9a8');
  const pr = clamp(dist / META, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(W - 14, 44, 6, 140);
  c.fillStyle = '#7CFF9E'; c.fillRect(W - 14, 44, 6, 140 * pr);
  texto(Math.floor(dist / 10) + ' m', W - 11, 196, 8, '#fff', 'right');

  // ---- poderes ----
  const dashPronto = dashCd <= 0, firePronto = fireCd <= 0, escudoPronto = escudoCd <= 0, gritoPronto = gritoCd <= 0;
  c.font = '13px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';

  c.beginPath(); c.arc(26, H - 26, 16, 0, 7); c.fillStyle = dashPronto ? 'rgba(191,232,255,.9)' : 'rgba(255,255,255,.2)'; c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  c.fillStyle = dashPronto ? '#123a55' : 'rgba(255,255,255,.5)'; c.fillText('␣', 26, H - 26);

  c.beginPath(); c.arc(64, H - 26, 16, 0, 7); c.fillStyle = firePronto ? 'rgba(255,154,61,.9)' : 'rgba(255,255,255,.2)'; c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  c.fillStyle = firePronto ? '#5c1210' : 'rgba(255,255,255,.5)'; c.fillText('E', 64, H - 26);

  c.beginPath(); c.arc(102, H - 26, 16, 0, 7); c.fillStyle = escudoPronto ? 'rgba(154,209,255,.9)' : 'rgba(255,255,255,.2)'; c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  c.fillStyle = escudoPronto ? '#123a55' : 'rgba(255,255,255,.5)'; c.fillText('F', 102, H - 26);

  c.beginPath(); c.arc(140, H - 26, 16, 0, 7); c.fillStyle = gritoPronto ? 'rgba(255,95,209,.9)' : 'rgba(255,255,255,.2)'; c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  c.fillStyle = gritoPronto ? '#3a0a2e' : 'rgba(255,255,255,.5)'; c.fillText('G', 140, H - 26);

  // indicador do ciclo da tecla Q
  const nomesQ = ['DASH', 'FOGO', 'ESCUDO', 'GRITO'];
  c.font = '9px sans-serif'; c.fillStyle = '#bfe8ff';
  c.fillText('Q → ' + nomesQ[qCiclo % 4], 83, H - 48);
}

function telas() {
  if (estado === 'inicio') {
    c.fillStyle = 'rgba(5,5,20,.72)'; c.fillRect(0, 0, W, H);
    texto('FAGULHA', W / 2, 150, 34, '#ffe9a8');
    texto('QUEDA ENTRE MUNDOS', W / 2, 200, 12, '#7af6ff');
    drawFagulha(c, W / 2, 345, .9, performance.now() / 1000, { pose: 'stand' });
    texto('← → MOVER   ESPAÇO DASH', W / 2, 455, 8, '#bfe8ff');
    texto('E FOGO   F ESCUDO   G GRITO', W / 2, 473, 8, '#bfe8ff');
    texto('Q ALTERNA ENTRE OS PODERES', W / 2, 491, 8, '#bfe8ff');
    if (Math.floor(performance.now() / 500) % 2) texto('APERTE ESPAÇO', W / 2, 520, 14, '#fff');
  } else if (estado === 'gameover') {
    c.fillStyle = 'rgba(30,0,10,.78)'; c.fillRect(0, 0, W, H);
    texto('GAME OVER', W / 2, 220, 30, '#ff3355');
    texto('💎 ' + cristais + '   ⬇ ' + Math.floor(dist / 10) + ' m', W / 2, 290, 12, '#fff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 400, 11, '#fff');
  } else if (estado === 'vitoria') {
    c.fillStyle = 'rgba(0,20,10,.78)'; c.fillRect(0, 0, W, H);
    texto('CHEGOU AO FUNDO!', W / 2, 170, 20, '#7CFF9E');
    drawFagulha(c, W / 2, 300, .95, performance.now() / 1000, { pose: 'cheer', glow: '#7CFF9E' });
    texto('💎 ' + cristais, W / 2, 470, 16, '#7af6ff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 540, 11, '#fff');
  }
}

/* ---------- laço principal ---------- */
let ultimo = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.033, (now - ultimo) / 1000)); ultimo = now;
  try {
    if (estado === 'inicio') t += dt;
    update(dt);
    desenhar();
  } catch (e) { console.error('Erro no jogo:', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
